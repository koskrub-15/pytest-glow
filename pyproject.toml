[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-glow"
dynamic = ["version"]
description = "A live, rich-powered pytest reporter that makes running tests a pleasure"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Konstantin" }]
keywords = ["pytest", "plugin", "reporter", "rich", "terminal", "progress", "coverage"]
dependencies = ["pytest>=8.0", "rich>=13.7"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/koskrub-15/pytest-glow"
Issues = "https://github.com/koskrub-15/pytest-glow/issues"
Changelog = "https://github.com/koskrub-15/pytest-glow/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
glow = "pytest_glow.plugin"

[dependency-groups]
dev = ["pytest-xdist", "pytest-cov", "ruff"]

[tool.hatch.version]
path = "src/pytest_glow/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_glow"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["demo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001", "RUF003",  # the glyphs (✓ ✗ × …) are the point
]
